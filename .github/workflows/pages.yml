name: Deploy RideTracker to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate active JavaScript syntax
        run: |
          for file in \
            update13.js update14.js update15.js update16.js update17.js update18.js update19.js \
            update23.js update24.js update25.js update26.js update27.js update28.js update29.js \
            shared/overlay/overlay-core.js scripts/prepare-pages.mjs; do
            node --check "$file"
          done

      - name: Remove legacy HUD markup
        run: node scripts/prepare-pages.mjs

      - name: Add active RideTracker modules
        run: |
          VERSION="${GITHUB_SHA}"
          sed -i "s#</body>#<script src=\"update6.js?v=${VERSION}\"></script><script src=\"update7.js?v=${VERSION}\"></script><script src=\"update8.js?v=${VERSION}\"></script><script type=\"module\" src=\"shared/ride-engine/browser-adapter.js?v=${VERSION}\"></script><script type=\"module\" src=\"update11.js?v=${VERSION}\"></script><script type=\"module\" src=\"update12.js?v=${VERSION}\"></script><script src=\"update13.js?v=${VERSION}\"></script><script src=\"update14.js?v=${VERSION}\"></script><script src=\"update16.js?v=${VERSION}\"></script><script src=\"update15.js?v=${VERSION}\"></script><script src=\"update17.js?v=${VERSION}\"></script><script src=\"update18.js?v=${VERSION}\"></script><script src=\"update19.js?v=${VERSION}\"></script><script src=\"update23.js?v=${VERSION}\"></script><script src=\"update24.js?v=${VERSION}\"></script><script src=\"update25.js?v=${VERSION}\"></script><script src=\"update26.js?v=${VERSION}\"></script><script src=\"update27.js?v=${VERSION}\"></script><script src=\"update28.js?v=${VERSION}\"></script><script src=\"update29.js?v=${VERSION}\"></script></body>#" index.html
          sed -i '/<head>/a <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">' index.html

      - name: Verify canonical HUD architecture
        run: |
          grep -q 'RideTrackerStandaloneHudEditor' update28.js
          grep -q 'update28.js?v=' index.html
          grep -q 'rtConfiguredLiveHud' update29.js
          grep -q 'update29.js?v=' index.html
          ! grep -q 'update20.js?v=' index.html
          ! grep -q 'update21.js?v=' index.html
          ! grep -q 'update22.js?v=' index.html
          ! grep -q 'update30.js?v=' index.html
          ! grep -q 'update31.js?v=' index.html
          ! grep -q 'update32.js?v=' index.html
          ! grep -q 'id="rtHudConfigView"' update23.js
          ! grep -q 'id="rtHudCanvas"' index.html
          ! grep -q '>Modus: Telemetrie<' index.html
          ! grep -E -q '>HUD: (Klein|Mittel|Groß)<' index.html
          ! grep -q '>HUD verschieben<' index.html
          ! grep -q '>Positionen zurücksetzen<' index.html
          grep -q 'id="rtLegacyTelemetryBridge"' index.html
          grep -q 'id="hudLong"' index.html
          ! grep -R -E 'Modus: Telemetrie|HUD: (Klein|Mittel|Groß)|HUD verschieben|Positionen zurücksetzen|Streckenkonstruktion' native-ios/RideTrackerNative/ContentView.swift native-android/app/src/main/java/de/ridetracker/FunctionalRideTrackerApp.kt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
