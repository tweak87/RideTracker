name: Publish RideTracker to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and schemas
        run: |
          for file in update*.js shared/core/*.js shared/visualization/*.js scripts/*.mjs; do
            node --check "$file"
          done
          python -m json.tool shared/devices/device-registry.schema.json >/dev/null
          python -m json.tool shared/core/configuration-snapshot.schema.json >/dev/null
          python -m json.tool shared/core/plugin-capabilities.schema.json >/dev/null
          python -m json.tool shared/core/plugin-diagnostics.json >/dev/null
          python -m json.tool shared/core/community-state.schema.json >/dev/null
          python -m json.tool shared/core/release-manifest.json >/dev/null

      - name: Run unit and regression tests
        run: npm test

      - name: Build canonical web directory
        env:
          VERSION: ${{ github.sha }}
        run: npm run build:pages

      - name: Verify community, 3D and core artifacts
        run: |
          grep -q 'RideTrackerDatabase' dist/core/storage/web-database-service.js
          grep -q 'RideTrackerGpsMath' dist/shared/ride-engine/gps-speed.js
          grep -q 'RideTrackerPreflight' dist/update61.js
          grep -q 'RideTrackerSupportCenter' dist/update61.js
          grep -q 'RideTrackerCommunityHub' dist/update62.js
          grep -q 'RideTrackerCompass' dist/update63.js
          grep -q 'RideTrackerRideContext' dist/update64.js
          grep -q 'RideTrackerCommunityBackend' dist/shared/core/community-backend.js
          grep -q 'RideTrackerTrack3D' dist/shared/visualization/track-3d.js
          grep -q 'rollback/pre-park-map-weather-20260808' dist/shared/core/release-manifest.js
          grep -q 'shared/core/community-backend.js?v=' dist/index.html
          grep -q 'shared/visualization/track-3d.js?v=' dist/index.html
          grep -q 'update62.js?v=' dist/index.html
          grep -q 'update63.js?v=' dist/index.html
          grep -q 'update64.js?v=' dist/index.html
          test -f dist/update62.js
          test -f dist/update63.js
          test -f dist/update64.js
          test -f dist/shared/core/community-backend.js
          test -f dist/shared/visualization/track-3d.js
          ! test -f dist/update6.js
          ! test -f dist/update7.js
          ! test -f dist/update8.js
          grep -q '<head><meta http-equiv="Cache-Control"' dist/index.html

      - name: Publish dist to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify published branch
        run: git ls-remote --exit-code origin refs/heads/gh-pages
