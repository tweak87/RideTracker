name: Publish RideTracker to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate active JavaScript syntax
        run: |
          for file in \
            update6.js update7.js update8.js update11.js update12.js \
            update13.js update14.js update15.js update16.js update17.js update18.js update19.js \
            update23.js update24.js update25.js update26.js update27.js update28.js update29.js \
            shared/overlay/overlay-core.js scripts/prepare-pages.mjs; do
            node --check "$file"
          done

      - name: Build canonical web directory
        run: |
          mkdir -p dist/shared dist/scripts
          cp index.html update6.js update7.js update8.js update11.js update12.js \
            update13.js update14.js update15.js update16.js update17.js update18.js update19.js \
            update23.js update24.js update25.js update26.js update27.js update28.js update29.js dist/
          cp -R shared/ride-engine dist/shared/
          cp -R shared/overlay dist/shared/
          cp scripts/prepare-pages.mjs dist/scripts/
          cd dist
          node scripts/prepare-pages.mjs
          VERSION="${GITHUB_SHA}"
          sed -i "s#</body>#<script src=\"update6.js?v=${VERSION}\"></script><script src=\"update7.js?v=${VERSION}\"></script><script src=\"update8.js?v=${VERSION}\"></script><script type=\"module\" src=\"shared/ride-engine/browser-adapter.js?v=${VERSION}\"></script><script type=\"module\" src=\"update11.js?v=${VERSION}\"></script><script type=\"module\" src=\"update12.js?v=${VERSION}\"></script><script src=\"update13.js?v=${VERSION}\"></script><script src=\"update14.js?v=${VERSION}\"></script><script src=\"update16.js?v=${VERSION}\"></script><script src=\"update15.js?v=${VERSION}\"></script><script src=\"update17.js?v=${VERSION}\"></script><script src=\"update18.js?v=${VERSION}\"></script><script src=\"update19.js?v=${VERSION}\"></script><script src=\"update23.js?v=${VERSION}\"></script><script src=\"update24.js?v=${VERSION}\"></script><script src=\"update25.js?v=${VERSION}\"></script><script src=\"update26.js?v=${VERSION}\"></script><script src=\"update27.js?v=${VERSION}\"></script><script src=\"update28.js?v=${VERSION}\"></script><script src=\"update29.js?v=${VERSION}\"></script></body>#" index.html
          sed -i '/<head>/a <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">' index.html
          touch .nojekyll

      - name: Verify canonical HUD artifact
        run: |
          grep -q 'RideTrackerStandaloneHudEditor' dist/update28.js
          grep -q 'update28.js?v=' dist/index.html
          grep -q 'rtConfiguredLiveHud' dist/update29.js
          grep -q 'update29.js?v=' dist/index.html
          ! find dist -maxdepth 1 \( -name 'update20.js' -o -name 'update21.js' -o -name 'update22.js' -o -name 'update30.js' -o -name 'update31.js' -o -name 'update32.js' \) | grep -q .
          ! grep -q 'id="rtHudConfigView"' dist/update23.js
          ! grep -q 'id="rtHudCanvas"' dist/index.html
          ! grep -q '>Modus: Telemetrie<' dist/index.html
          ! grep -E -q '>HUD: (Klein|Mittel|Groß)<' dist/index.html
          ! grep -q '>HUD verschieben<' dist/index.html
          ! grep -q '>Positionen zurücksetzen<' dist/index.html
          ! grep -q '>HUD konfigurieren<' dist/index.html
          grep -q 'id="rtLegacyTelemetryBridge"' dist/index.html
          grep -q 'id="hudLong"' dist/index.html

      - name: Publish dist to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify published branch
        run: git ls-remote --exit-code origin refs/heads/gh-pages
