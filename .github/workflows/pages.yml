name: Publish RideTracker to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate active JavaScript syntax
        run: |
          for file in \
            update6.js update7.js update8.js update11.js update12.js \
            update13.js update14.js update15.js update16.js update17.js update18.js update19.js \
            update23.js update24.js update25.js update26.js update27.js update28.js update29.js update33.js update34.js update35.js update36.js update37.js update38.js update39.js update40.js update41.js update42.js update43.js update44.js update45.js update46.js update47.js update49.js update50.js update51.js update52.js update53.js update54.js update55.js update56.js update57.js update58.js update59.js update60.js update61.js \
            core/storage/web-database-service.js core/ridetracker-core.mjs core/builtin-plugins.mjs core/adapters/web-runtime-adapter.mjs core/adapters/web-plugin-runtimes.mjs core/adapters/web-plugin-ui.mjs \
            shared/overlay/overlay-core.js shared/ride-engine/gps-speed.js shared/core/community-model.js shared/core/release-manifest.js scripts/prepare-pages.mjs scripts/build-pages.mjs scripts/web-e2e-server.mjs scripts/audit-web-startup.mjs scripts/audit-frontend-managers.mjs scripts/audit-runtime-regressions.mjs; do
            node --check "$file"
          done
          node shared/ride-engine/gps-speed.test.mjs
          node shared/core/community-model.test.mjs
          node scripts/audit-web-startup.mjs
          node scripts/audit-frontend-managers.mjs
          node scripts/audit-runtime-regressions.mjs
          python -m json.tool shared/devices/device-registry.schema.json >/dev/null
          python -m json.tool shared/core/configuration-snapshot.schema.json >/dev/null
          python -m json.tool shared/core/plugin-capabilities.schema.json >/dev/null
          python -m json.tool shared/core/plugin-diagnostics.json >/dev/null
          python -m json.tool shared/core/community-state.schema.json >/dev/null
          python -m json.tool shared/core/release-manifest.json >/dev/null

      - name: Build canonical web directory
        run: |
          mkdir -p dist/shared dist/scripts
          cp index.html update11.js update12.js \
            update13.js update14.js update15.js update16.js update17.js update18.js update19.js \
            update23.js update24.js update25.js update26.js update27.js update28.js update29.js update33.js update34.js update35.js update36.js update37.js update38.js update39.js update40.js update41.js update42.js update43.js update44.js update45.js update46.js update47.js update49.js update50.js update51.js update52.js update53.js update54.js update55.js update56.js update57.js update58.js update59.js update60.js update61.js dist/
          cp -R core dist/core
          cp -R shared/ride-engine dist/shared/
          cp -R shared/overlay dist/shared/
          cp -R shared/devices dist/shared/
          cp -R shared/core dist/shared/
          cp scripts/prepare-pages.mjs scripts/audit-web-startup.mjs scripts/audit-frontend-managers.mjs scripts/audit-runtime-regressions.mjs dist/scripts/
          cd dist
          node scripts/prepare-pages.mjs
          VERSION="${GITHUB_SHA}"
          sed -i "s#</body>#<script src=\"core/storage/web-database-service.js?v=${VERSION}\"></script><script src=\"shared/ride-engine/gps-speed.js?v=${VERSION}\"></script><script type=\"module\" src=\"shared/ride-engine/browser-adapter.js?v=${VERSION}\"></script><script type=\"module\" src=\"update11.js?v=${VERSION}\"></script><script type=\"module\" src=\"update12.js?v=${VERSION}\"></script><script src=\"update13.js?v=${VERSION}\"></script><script src=\"update14.js?v=${VERSION}\"></script><script src=\"update16.js?v=${VERSION}\"></script><script src=\"update15.js?v=${VERSION}\"></script><script src=\"update17.js?v=${VERSION}\"></script><script src=\"update18.js?v=${VERSION}\"></script><script src=\"update19.js?v=${VERSION}\"></script><script src=\"update23.js?v=${VERSION}\"></script><script src=\"update24.js?v=${VERSION}\"></script><script src=\"update25.js?v=${VERSION}\"></script><script src=\"update26.js?v=${VERSION}\"></script><script src=\"update27.js?v=${VERSION}\"></script><script src=\"update28.js?v=${VERSION}\"></script><script src=\"update29.js?v=${VERSION}\"></script><script src=\"update33.js?v=${VERSION}\"></script><script src=\"update34.js?v=${VERSION}\"></script><script src=\"update35.js?v=${VERSION}\"></script><script src=\"update36.js?v=${VERSION}\"></script><script src=\"update37.js?v=${VERSION}\"></script><script type=\"module\" src=\"core/adapters/web-runtime-adapter.mjs?v=${VERSION}\"></script><script type=\"module\" src=\"core/adapters/web-plugin-runtimes.mjs?v=${VERSION}\"></script><script src=\"update38.js?v=${VERSION}\"></script><script src=\"update39.js?v=${VERSION}\"></script><script src=\"update43.js?v=${VERSION}\"></script><script src=\"update44.js?v=${VERSION}\"></script><script src=\"update45.js?v=${VERSION}\"></script><script src=\"update41.js?v=${VERSION}\"></script><script src=\"update42.js?v=${VERSION}\"></script><script src=\"update40.js?v=${VERSION}\"></script><script src=\"update46.js?v=${VERSION}\"></script><script src=\"update47.js?v=${VERSION}\"></script><script src=\"update49.js?v=${VERSION}\"></script><script type=\"module\" src=\"core/adapters/web-plugin-ui.mjs?v=${VERSION}\"></script><script src=\"update50.js?v=${VERSION}\"></script><script src=\"update51.js?v=${VERSION}\"></script><script src=\"update52.js?v=${VERSION}\"></script><script src=\"update53.js?v=${VERSION}\"></script><script src=\"update54.js?v=${VERSION}\"></script><script src=\"update55.js?v=${VERSION}\"></script><script src=\"update56.js?v=${VERSION}\"></script><script src=\"update57.js?v=${VERSION}\"></script><script src=\"update58.js?v=${VERSION}\"></script><script src=\"update59.js?v=${VERSION}\"></script><script src=\"update60.js?v=${VERSION}\"></script></body>#" index.html
          sed -i 's#<head>#<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">#' index.html
          sed -i "s#<script type=\"module\" src=\"shared/ride-engine/browser-adapter.js#<script src=\"shared/core/community-model.js?v=${VERSION}\"></script><script src=\"shared/core/release-manifest.js?v=${VERSION}\"></script><script type=\"module\" src=\"shared/ride-engine/browser-adapter.js#" index.html
          sed -i "s#</body>#<script src=\"update61.js?v=${VERSION}\"></script></body>#" index.html
          node scripts/audit-web-startup.mjs
          node scripts/audit-frontend-managers.mjs
          node scripts/audit-runtime-regressions.mjs
          touch .nojekyll

      - name: Verify canonical HUD device ride and reference artifacts
        run: |
          grep -q 'RideTrackerStandaloneHudEditor' dist/update28.js
          grep -q 'rtConfiguredLiveHud' dist/update29.js
          grep -q 'RideTrackerDeviceCenter' dist/update33.js
          grep -q 'RideTrackerDatabase' dist/core/storage/web-database-service.js
          grep -q 'RideTrackerRideLibrary' dist/update37.js
          grep -q 'RideTrackerNavigationRegistry' dist/update49.js
          grep -q 'RideTrackerGpsCapture' dist/update54.js
          grep -q 'watchPosition' dist/update54.js
          grep -q 'themeparks.wiki' dist/update54.js
          grep -q 'RideTrackerConfidenceEngine' dist/update55.js
          grep -q 'RideTrackerCommunityReference' dist/update56.js
          grep -q 'coasterpedia.net' dist/update56.js
          grep -q 'RideTrackerCountryParkDirectory' dist/update57.js
          grep -q 'lightweightParks' dist/update57.js
          grep -q 'overpass.kumi.systems' dist/update57.js
          grep -q 'RideTrackerGpsHealth' dist/update58.js
          grep -q 'RideTrackerGpsMath' dist/shared/ride-engine/gps-speed.js
          grep -q 'shared/ride-engine/gps-speed.js?v=' dist/index.html
          grep -q 'derivedMS' dist/update58.js
          grep -q 'ride-validated' dist/update58.js
          grep -q 'ridetracker:internal-telemetry' dist/update58.js
          grep -q 'RideTrackerSensorChannelRegistry' dist/update59.js
          grep -q 'sensor-channels-updated' dist/update59.js
          grep -q 'sensor.channels' dist/core/builtin-plugins.mjs
          grep -q 'diagnostics.live' dist/core/builtin-plugins.mjs
          grep -q 'RideTrackerDiagnostics' dist/update60.js
          grep -q 'safeBoot' dist/update60.js
          grep -q 'Diagnostic report exported' dist/update60.js
          grep -q 'update60.js?v=' dist/index.html
          grep -q 'RideTrackerCommunity' dist/update61.js
          grep -q 'RideTrackerPreflight' dist/update61.js
          grep -q 'RideTrackerSupportCenter' dist/update61.js
          grep -q 'RideTrackerAdminCenter' dist/update61.js
          grep -q 'rollback/pre-community-foundation-20260808' dist/shared/core/release-manifest.js
          grep -q 'shared/core/community-model.js?v=' dist/index.html
          grep -q 'update61.js?v=' dist/index.html
          test -f dist/update54.js
          test -f dist/update55.js
          test -f dist/update56.js
          test -f dist/update57.js
          test -f dist/update58.js
          test -f dist/update59.js
          test -f dist/update60.js
          test -f dist/update61.js
          test -f dist/core/ridetracker-core.mjs
          test -f dist/core/builtin-plugins.mjs
          ! test -f dist/update6.js
          ! test -f dist/update7.js
          ! test -f dist/update8.js
          ! grep -q 'update6.js?v=' dist/index.html
          ! grep -q 'update7.js?v=' dist/index.html
          ! grep -q 'update8.js?v=' dist/index.html
          grep -q '<head><meta http-equiv="Cache-Control"' dist/index.html

      - name: Publish dist to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify published branch
        run: git ls-remote --exit-code origin refs/heads/gh-pages
