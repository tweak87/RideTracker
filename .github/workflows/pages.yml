name: Publish RideTracker to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate active JavaScript syntax
        run: |
          # Legacy update6/update7/update8 stay source-controlled but are no longer part of the production boot.
          for file in \
            update6.js update7.js update8.js update11.js update12.js \
            update13.js update14.js update15.js update16.js update17.js update18.js update19.js \
            update23.js update24.js update25.js update26.js update27.js update28.js update29.js update33.js update34.js update35.js update36.js update37.js update38.js update39.js update40.js update41.js update42.js update43.js update44.js update45.js update46.js update47.js update49.js update50.js update51.js update52.js update53.js \
            core/storage/web-database-service.js core/ridetracker-core.mjs core/builtin-plugins.mjs core/adapters/web-runtime-adapter.mjs core/adapters/web-plugin-runtimes.mjs core/adapters/web-plugin-ui.mjs \
            shared/overlay/overlay-core.js scripts/prepare-pages.mjs scripts/audit-web-startup.mjs scripts/audit-frontend-managers.mjs; do
            node --check "$file"
          done
          node scripts/audit-web-startup.mjs
          node scripts/audit-frontend-managers.mjs
          python -m json.tool shared/devices/device-registry.schema.json >/dev/null
          python -m json.tool shared/core/configuration-snapshot.schema.json >/dev/null
          python -m json.tool shared/core/plugin-capabilities.schema.json >/dev/null
          python -m json.tool shared/core/plugin-diagnostics.json >/dev/null

      - name: Build canonical web directory
        run: |
          mkdir -p dist/shared dist/scripts
          cp index.html update11.js update12.js \
            update13.js update14.js update15.js update16.js update17.js update18.js update19.js \
            update23.js update24.js update25.js update26.js update27.js update28.js update29.js update33.js update34.js update35.js update36.js update37.js update38.js update39.js update40.js update41.js update42.js update43.js update44.js update45.js update46.js update47.js update49.js update50.js update51.js update52.js update53.js dist/
          cp -R core dist/core
          cp -R shared/ride-engine dist/shared/
          cp -R shared/overlay dist/shared/
          cp -R shared/devices dist/shared/
          cp -R shared/core dist/shared/
          cp scripts/prepare-pages.mjs scripts/audit-web-startup.mjs scripts/audit-frontend-managers.mjs dist/scripts/
          cd dist
          node scripts/prepare-pages.mjs
          VERSION="${GITHUB_SHA}"
          sed -i "s#</body>#<script src=\"core/storage/web-database-service.js?v=${VERSION}\"></script><script type=\"module\" src=\"shared/ride-engine/browser-adapter.js?v=${VERSION}\"></script><script type=\"module\" src=\"update11.js?v=${VERSION}\"></script><script type=\"module\" src=\"update12.js?v=${VERSION}\"></script><script src=\"update13.js?v=${VERSION}\"></script><script src=\"update14.js?v=${VERSION}\"></script><script src=\"update16.js?v=${VERSION}\"></script><script src=\"update15.js?v=${VERSION}\"></script><script src=\"update17.js?v=${VERSION}\"></script><script src=\"update18.js?v=${VERSION}\"></script><script src=\"update19.js?v=${VERSION}\"></script><script src=\"update23.js?v=${VERSION}\"></script><script src=\"update24.js?v=${VERSION}\"></script><script src=\"update25.js?v=${VERSION}\"></script><script src=\"update26.js?v=${VERSION}\"></script><script src=\"update27.js?v=${VERSION}\"></script><script src=\"update28.js?v=${VERSION}\"></script><script src=\"update29.js?v=${VERSION}\"></script><script src=\"update33.js?v=${VERSION}\"></script><script src=\"update34.js?v=${VERSION}\"></script><script src=\"update35.js?v=${VERSION}\"></script><script src=\"update36.js?v=${VERSION}\"></script><script src=\"update37.js?v=${VERSION}\"></script><script type=\"module\" src=\"core/adapters/web-runtime-adapter.mjs?v=${VERSION}\"></script><script type=\"module\" src=\"core/adapters/web-plugin-runtimes.mjs?v=${VERSION}\"></script><script src=\"update38.js?v=${VERSION}\"></script><script src=\"update39.js?v=${VERSION}\"></script><script src=\"update43.js?v=${VERSION}\"></script><script src=\"update44.js?v=${VERSION}\"></script><script src=\"update45.js?v=${VERSION}\"></script><script src=\"update41.js?v=${VERSION}\"></script><script src=\"update42.js?v=${VERSION}\"></script><script src=\"update40.js?v=${VERSION}\"></script><script src=\"update46.js?v=${VERSION}\"></script><script src=\"update47.js?v=${VERSION}\"></script><script src=\"update49.js?v=${VERSION}\"></script><script type=\"module\" src=\"core/adapters/web-plugin-ui.mjs?v=${VERSION}\"></script><script src=\"update50.js?v=${VERSION}\"></script><script src=\"update51.js?v=${VERSION}\"></script><script src=\"update52.js?v=${VERSION}\"></script><script src=\"update53.js?v=${VERSION}\"></script></body>#" index.html
          sed -i 's#<head>#<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">#' index.html
          node scripts/audit-web-startup.mjs
          node scripts/audit-frontend-managers.mjs
          touch .nojekyll

      - name: Verify canonical HUD device ride and core artifact
        run: |
          grep -q 'RideTrackerStandaloneHudEditor' dist/update28.js
          grep -q 'rtConfiguredLiveHud' dist/update29.js
          grep -q 'baseRecordingState' dist/update29.js
          grep -q 'RideTrackerDeviceCenter' dist/update33.js
          grep -q 'RideTrackerSourceRouting' dist/update34.js
          grep -q 'RideTrackerRecordingSourceRouter' dist/update35.js
          grep -q 'RideTrackerCameraSources' dist/update36.js
          grep -q 'syncFromStream' dist/update36.js
          grep -q 'RideTrackerDatabase' dist/core/storage/web-database-service.js
          grep -q 'destroy' dist/core/storage/web-database-service.js
          grep -q 'MIN_SCHEMA_VERSION = 6' dist/core/storage/web-database-service.js
          grep -q 'RideTrackerRideLibrary' dist/update37.js
          grep -q 'RideTrackerRecordingFullscreen' dist/update39.js
          grep -q 'RideTrackerPostRecording' dist/update43.js
          grep -q 'RideTrackerRecordingSession' dist/update45.js
          grep -q 'RideTrackerFrontendNavigation' dist/update46.js
          grep -q 'RideTrackerCanonicalRoutes' dist/update47.js
          grep -q 'RideTrackerMediaExport' dist/update47.js
          grep -q 'RideTrackerNavigationRegistry' dist/update49.js
          grep -q 'RideTrackerDialogManager' dist/update49.js
          grep -q 'RideTrackerOverlayManager' dist/update49.js
          grep -q 'RideTrackerOrientationManager' dist/update49.js
          grep -q 'RideTrackerHudStageFit' dist/update50.js
          grep -q 'RideTrackerLiveSensorDiagnostics' dist/update50.js
          grep -q 'RideTrackerExternalSensorConnections' dist/update51.js
          grep -q 'Suchen & verbinden' dist/update51.js
          grep -q 'RideTrackerHudPortraitFit' dist/update52.js
          grep -q 'Frontkamera verwenden' dist/update52.js
          grep -q 'RideTrackerHardDelete' dist/update53.js
          grep -q 'RideTrackerParkTrackMatcher' dist/update53.js
          grep -q 'RideTrackerDynamicWidgets' dist/update53.js
          grep -q 'overpass-api.de' dist/update53.js
          grep -q 'device.discovery' dist/core/builtin-plugins.mjs
          grep -q 'device.connection' dist/core/builtin-plugins.mjs
          grep -q 'scanAndConnect' dist/core/adapters/web-plugin-runtimes.mjs
          grep -q 'connectHeartRate' dist/core/adapters/web-plugin-runtimes.mjs
          grep -q 'connectAccessory' dist/core/adapters/web-plugin-runtimes.mjs
          grep -q 'RideTrackerSensorDiagnostics' dist/core/adapters/web-plugin-ui.mjs
          grep -q 'RideTrackerRenderedExport' dist/core/adapters/web-plugin-ui.mjs
          grep -q 'update53.js?v=' dist/index.html
          grep -q 'rtInlineDashboard' dist/index.html
          test -f dist/update53.js
          test -f dist/core/ridetracker-core.mjs
          test -f dist/core/builtin-plugins.mjs
          test -f dist/core/storage/web-database-service.js
          test -f dist/core/adapters/web-plugin-runtimes.mjs
          test -f dist/core/adapters/web-plugin-ui.mjs
          test -f dist/shared/devices/device-registry.schema.json
          test -f dist/shared/core/plugin-capabilities.schema.json
          ! test -f dist/update6.js
          ! test -f dist/update7.js
          ! test -f dist/update8.js
          ! grep -q 'update6.js?v=' dist/index.html
          ! grep -q 'update7.js?v=' dist/index.html
          ! grep -q 'update8.js?v=' dist/index.html
          ! find dist -maxdepth 1 \( -name 'update20.js' -o -name 'update21.js' -o -name 'update22.js' -o -name 'update30.js' -o -name 'update31.js' -o -name 'update32.js' \) | grep -q .
          ! grep -q 'id="rtHudConfigView"' dist/update23.js
          ! grep -q '>Modus: Telemetrie<' dist/index.html
          ! grep -E -q '>HUD: (Klein|Mittel|Groß)<' dist/index.html
          grep -q '<head><meta http-equiv="Cache-Control"' dist/index.html
          ! grep -q '<style>[[:space:]]*<meta' dist/index.html

      - name: Publish dist to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish ${GITHUB_SHA}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify published branch
        run: git ls-remote --exit-code origin refs/heads/gh-pages
