name: Deploy RideTracker to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check update13.js
          node --check update14.js
          node --check update15.js
          node --check update16.js
          node --check update17.js
          node --check update18.js
          node --check update19.js

      - name: Add RideTracker modules
        run: sed -i 's#</body>#<script src="update6.js"></script><script src="update7.js"></script><script src="update8.js"></script><script type="module" src="shared/ride-engine/browser-adapter.js"></script><script type="module" src="update11.js"></script><script type="module" src="update12.js"></script><script src="update13.js"></script><script src="update14.js"></script><script src="update16.js"></script><script src="update15.js"></script><script src="update17.js"></script><script src="update18.js"></script><script src="update19.js"></script></body>#' index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
