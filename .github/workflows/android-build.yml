name: Build Android

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "native-android/**"
      - "shared/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "native-android/**"
      - "shared/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: native-android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: native-android
        run: gradle :app:lintDebug :app:lintDeviceTest :app:lintFireTest --stacktrace

      - name: Build standard, device-test and Fire OS APKs
        working-directory: native-android
        run: gradle :app:assembleDebug :app:assembleDeviceTest :app:assembleFireTest --stacktrace

      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp native-android/app/build/outputs/apk/debug/app-debug.apk dist/RideTracker-Android-2026.08.09.4-debug.apk
          cp native-android/app/build/outputs/apk/deviceTest/app-deviceTest.apk dist/INSTALL-RideTracker-ANDROID-DEVICE-v2026.08.09.4.apk
          cp native-android/app/build/outputs/apk/fireTest/app-fireTest.apk dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.09.4.apk
          test -s dist/RideTracker-Android-2026.08.09.4-debug.apk
          test -s dist/INSTALL-RideTracker-ANDROID-DEVICE-v2026.08.09.4.apk
          test -s dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.09.4.apk

      - name: Verify APK package, SDK, signature and archive
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          DEVICE_APK="dist/INSTALL-RideTracker-ANDROID-DEVICE-v2026.08.09.4.apk"
          FIRE_APK="dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.09.4.apk"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$DEVICE_APK" | tee dist/device-apk-signature.txt
          "$BUILD_TOOLS_DIR/aapt" dump badging "$DEVICE_APK" | tee dist/device-apk-badging.txt
          unzip -t "$DEVICE_APK" | tee dist/device-apk-archive-test.txt
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$FIRE_APK" | tee dist/fire-apk-signature.txt
          "$BUILD_TOOLS_DIR/aapt" dump badging "$FIRE_APK" | tee dist/fire-apk-badging.txt
          unzip -t "$FIRE_APK" | tee dist/fire-apk-archive-test.txt
          grep -q "package: name='de.ridetracker.devicev8'" dist/device-apk-badging.txt
          grep -q "application-label:'RideTracker DEVICE v8'" dist/device-apk-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" dist/device-apk-signature.txt
          grep -q "package: name='de.ridetracker.fire8v8'" dist/fire-apk-badging.txt
          grep -q "sdkVersion:'21'" dist/fire-apk-badging.txt
          grep -q "application-label:'RideTracker FIRE 8 v8'" dist/fire-apk-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" dist/fire-apk-signature.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RideTracker-Android-debug
          path: |
            dist/RideTracker-Android-2026.08.09.4-debug.apk
            dist/INSTALL-RideTracker-ANDROID-DEVICE-v2026.08.09.4.apk
            dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.09.4.apk
            dist/device-apk-signature.txt
            dist/device-apk-badging.txt
            dist/device-apk-archive-test.txt
            dist/fire-apk-signature.txt
            dist/fire-apk-badging.txt
            dist/fire-apk-archive-test.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: android-v2026.08.09.4
          STANDARD_APK: dist/RideTracker-Android-2026.08.09.4-debug.apk
          DEVICE_APK: dist/INSTALL-RideTracker-ANDROID-DEVICE-v2026.08.09.4.apk
          FIRE_APK: dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.09.4.apk
        run: |
          if gh release view "$APK_TAG" >/dev/null 2>&1; then
            gh release upload "$APK_TAG" "$STANDARD_APK" "$DEVICE_APK" "$FIRE_APK" --clobber
          else
            gh release create "$APK_TAG" "$STANDARD_APK" "$DEVICE_APK" "$FIRE_APK" --target "$GITHUB_SHA" --prerelease --title "RideTracker Android 2026.08.09.4 (GNSS & 3D Track)" --notes "Für Huawei/Android INSTALL-RideTracker-ANDROID-DEVICE-v2026.08.09.4.apk und für Fire OS ausschließlich INSTALL-RideTracker-FIRE-OS-8-v2026.08.09.4.apk verwenden. Die neuen v8-Paket-IDs vermeiden Signaturkonflikte mit früheren Testbuilds. Neu sind eine korrigierte Geh- und GPS-Ersatzgeschwindigkeit, GNSS-Qualität mit Genauigkeit und Satelliten, ein gemeinsames Live-/Editor-HUD, verbesserte Scroll- und Tastaturbedienung, alphabetische Park-/Attraktionswahl, Fahrt-Vollständigkeit und ein geglättetes 3D-Achterbahnmodell mit Boden, Schienen und Stützen. Dies sind Debug-Testbuilds; Installation aus unbekannten Quellen muss für Dateien/Silk bewusst erlaubt werden."
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideTracker-Android-reports
          path: |
            native-android/app/build/reports/tests/
            native-android/app/build/reports/lint-results-debug.html
            native-android/app/build/reports/lint-results-debug.xml
            native-android/app/build/reports/lint-results-deviceTest.html
            native-android/app/build/reports/lint-results-deviceTest.xml
            native-android/app/build/reports/lint-results-fireTest.html
            native-android/app/build/reports/lint-results-fireTest.xml
          if-no-files-found: ignore
          retention-days: 14
