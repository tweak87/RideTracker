name: Build Android

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "native-android/**"
      - "shared/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "native-android/**"
      - "shared/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: native-android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: native-android
        run: gradle :app:lintDebug :app:lintFireTest --stacktrace

      - name: Build standard and Fire OS APKs
        working-directory: native-android
        run: gradle :app:assembleDebug :app:assembleFireTest --stacktrace

      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp native-android/app/build/outputs/apk/debug/app-debug.apk dist/RideTracker-Android-2026.08.08.3-debug.apk
          cp native-android/app/build/outputs/apk/fireTest/app-fireTest.apk dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.08.3.apk
          test -s dist/RideTracker-Android-2026.08.08.3-debug.apk
          test -s dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.08.3.apk

      - name: Verify APK package, SDK, signature and archive
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          FIRE_APK="dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.08.3.apk"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$FIRE_APK" | tee dist/fire-apk-signature.txt
          "$BUILD_TOOLS_DIR/aapt" dump badging "$FIRE_APK" | tee dist/fire-apk-badging.txt
          unzip -t "$FIRE_APK" | tee dist/fire-apk-archive-test.txt
          grep -q "package: name='de.ridetracker.fire8v3'" dist/fire-apk-badging.txt
          grep -q "sdkVersion:'21'" dist/fire-apk-badging.txt
          grep -q "application-label:'RideTracker FIRE 8 TEST'" dist/fire-apk-badging.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" dist/fire-apk-signature.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RideTracker-Android-debug
          path: |
            dist/RideTracker-Android-2026.08.08.3-debug.apk
            dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.08.3.apk
            dist/fire-apk-signature.txt
            dist/fire-apk-badging.txt
            dist/fire-apk-archive-test.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: android-v2026.08.08.3
          STANDARD_APK: dist/RideTracker-Android-2026.08.08.3-debug.apk
          FIRE_APK: dist/INSTALL-RideTracker-FIRE-OS-8-v2026.08.08.3.apk
        run: |
          if gh release view "$APK_TAG" >/dev/null 2>&1; then
            gh release upload "$APK_TAG" "$STANDARD_APK" "$FIRE_APK" --clobber
          else
            gh release create "$APK_TAG" "$STANDARD_APK" "$FIRE_APK" --target "$GITHUB_SHA" --prerelease --title "RideTracker Android 2026.08.08.3 (Fire OS 8)" --notes "Für Fire OS ausschließlich INSTALL-RideTracker-FIRE-OS-8-v2026.08.08.3.apk verwenden. Sie trägt gut sichtbar den Namen RideTracker FIRE 8 TEST und die neue Paket-ID de.ridetracker.fire8v3, damit kein Signaturkonflikt mit früheren Testbuilds entsteht. Native Bibliotheken verwenden das ältere, auf Fire OS robustere Extraktionsformat. GPS läuft ohne Google Play Services über Android LocationManager. Dies ist ein Debug-Testbuild; Installation aus unbekannten Quellen muss für Dateien/Silk bewusst erlaubt werden."
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideTracker-Android-reports
          path: |
            native-android/app/build/reports/tests/
            native-android/app/build/reports/lint-results-debug.html
            native-android/app/build/reports/lint-results-debug.xml
            native-android/app/build/reports/lint-results-fireTest.html
            native-android/app/build/reports/lint-results-fireTest.xml
          if-no-files-found: ignore
          retention-days: 14
