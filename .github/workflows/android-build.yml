name: Build Android

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "native-android/**"
      - "shared/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: native-android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: native-android
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        working-directory: native-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare installable APK
        run: |
          mkdir -p dist
          cp native-android/app/build/outputs/apk/debug/app-debug.apk dist/RideTracker-Android-2026.08.08.1-debug.apk
          test -s dist/RideTracker-Android-2026.08.08.1-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RideTracker-Android-debug
          path: dist/RideTracker-Android-2026.08.08.1-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: android-v2026.08.08.1
          APK_FILE: dist/RideTracker-Android-2026.08.08.1-debug.apk
        run: |
          if gh release view "$APK_TAG" >/dev/null 2>&1; then
            gh release upload "$APK_TAG" "$APK_FILE" --clobber
          else
            gh release create "$APK_TAG" "$APK_FILE" --target "$GITHUB_SHA" --prerelease --title "RideTracker Android 2026.08.08.1 (Test)" --notes "Nicht signierter Play-Store-Build: Debug-APK für direkte Tests. Installation aus unbekannten Quellen muss auf dem Testgerät bewusst erlaubt werden."
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideTracker-Android-reports
          path: |
            native-android/app/build/reports/tests/
            native-android/app/build/reports/lint-results-debug.html
            native-android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
