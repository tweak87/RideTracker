name: Build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "native-android/**"
      - "shared/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: native-android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: native-android
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        working-directory: native-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RideTracker-Android-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RideTracker-Android-reports
          path: |
            native-android/app/build/reports/tests/
            native-android/app/build/reports/lint-results-debug.html
            native-android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
