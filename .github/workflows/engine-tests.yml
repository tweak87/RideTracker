name: Test Ride Engine

on:
  push:
    paths:
      - 'shared/**'
      - 'core/**'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'core/**'
  workflow_dispatch:

jobs:
  test-js-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared schemas
        run: |
          python -m json.tool shared/core/configuration-snapshot.schema.json >/dev/null
          python -m json.tool shared/core/plugin-capabilities.schema.json >/dev/null
          python -m json.tool shared/devices/device-registry.schema.json >/dev/null
          python -m json.tool shared/core/community-state.schema.json >/dev/null
          python -m json.tool shared/core/release-manifest.json >/dev/null
      - name: Run canonical fixture
        run: node shared/ride-engine/ride-engine.test.mjs
      - name: Run sensor fusion tests
        run: node shared/ride-engine/sensor-fusion.test.mjs
      - name: Run canonical GPS speed tests
        run: node shared/ride-engine/gps-speed.test.mjs
      - name: Run community model tests
        run: node shared/core/community-model.test.mjs
      - name: Run community backend security tests
        run: node shared/core/community-backend.test.mjs
      - name: Run 3D track model tests
        run: node shared/visualization/track-3d.test.mjs
      - name: Validate community SQL schema
        run: node backend/supabase/community-schema.test.mjs
      - name: Run RidePackage contract tests
        run: node shared/ride-engine/ride-package.test.mjs
      - name: Run overlay specification tests
        run: node shared/overlay/overlay-core.test.mjs
      - name: Run RideTracker Core contract tests
        run: node core/ridetracker-core.test.mjs
      - name: Run plugin capability contract tests
        run: node core/plugin-capabilities.test.mjs
